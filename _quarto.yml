project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "unidades.qmd"
    - "programa.qmd"
    - "metodologia.qmd"
    - "docente.qmd"
    - "marco-legal/*.qmd"
    - "encuentros/*.qmd"
    - "laboratorios/*.qmd"
    - "slides/*.qmd"
    - "casos/*.qmd"
    - "actividades/*.qmd"
    - "recursos/*.qmd"
    - "lecturas/*.qmd"
    - "guia-docente/*.qmd"
    - "!README.md"
  resources:
    - "data/**"
    - "scripts/**"
    - "assets/**"
    - "labs/**"

website:
  title: "Leyes, Ética y Protección de Datos"
  description: >
    Espacio académico de la Especialización en Análisis Estadístico para Ciencia
    de Datos. Fundamentos legales, ética de los datos y técnicas de protección
    aplicadas a proyectos de analítica, inteligencia artificial y datos masivos.
  site-url: https://wilsonsr.github.io/leyes-etica-proteccion-datos/
  repo-url: https://github.com/wilsonsr/leyes-etica-proteccion-datos
  repo-actions: [source, issue]
  favicon: styles/favicon.svg
  open-graph: true
  search:
    location: navbar
    type: overlay

  navbar:
    background: primary
    pinned: true
    logo: styles/logo.svg
    logo-alt: "Leyes, Ética y Protección de Datos"
    title: "Leyes, Ética y Protección de Datos"
    left:
